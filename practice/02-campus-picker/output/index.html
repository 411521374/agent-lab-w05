<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Activity Picker</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172026;
      --muted: #60717d;
      --line: #d8e0e4;
      --paper: #fbfcf7;
      --panel: #ffffff;
      --blue: #2f6f9f;
      --green: #4f7d57;
      --gold: #b7791f;
      --coral: #bf5b45;
      --shadow: 0 12px 28px rgba(23, 32, 38, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        linear-gradient(120deg, rgba(47, 111, 159, 0.12), transparent 32%),
        linear-gradient(260deg, rgba(79, 125, 87, 0.14), transparent 30%),
        var(--paper);
      color: var(--ink);
    }

    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.15;
      font-weight: 760;
    }

    .subhead {
      color: var(--muted);
      margin: 8px 0 0;
      max-width: 680px;
    }

    .toolbar,
    .controls,
    .result,
    .history,
    .activity-strip {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .controls {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 700;
      color: #24333b;
    }

    select,
    button {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    select {
      padding: 0 10px;
    }

    button {
      cursor: pointer;
      font-weight: 760;
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    button.secondary {
      background: #f4f7f8;
    }

    button.danger {
      border-color: rgba(191, 91, 69, 0.42);
      color: #8f321f;
      background: #fff8f5;
    }

    .count {
      min-height: 40px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #eff5f1;
      color: #294e31;
      font-weight: 700;
    }

    .content {
      display: grid;
      gap: 18px;
    }

    .result {
      min-height: 260px;
      padding: 22px;
      display: grid;
      gap: 18px;
      align-content: start;
      position: relative;
      overflow: hidden;
    }

    .result::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 8px;
      background: linear-gradient(var(--green), var(--gold), var(--coral));
    }

    .activity-id {
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 13px;
    }

    .activity-name {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
    }

    .empty {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
      max-width: 560px;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .fact {
      min-height: 78px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfdfa;
    }

    .fact span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .fact strong {
      font-size: 18px;
    }

    .history,
    .activity-strip {
      padding: 16px;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .history-list,
    .activity-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history-list li,
    .activity-list li {
      min-height: 42px;
      display: grid;
      grid-template-columns: 58px 1fr auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
    }

    .tag {
      min-width: 56px;
      display: inline-flex;
      justify-content: center;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      color: white;
      background: var(--green);
      font-weight: 760;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    @media (max-width: 820px) {
      main {
        width: min(100vw - 20px, 680px);
        padding: 18px 0;
      }

      header,
      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 26px;
      }

      .facts {
        grid-template-columns: 1fr;
      }

      .history-list li,
      .activity-list li {
        grid-template-columns: 52px 1fr;
      }

      .meta {
        grid-column: 2;
      }
    .disclaimer {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px dashed var(--line);
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1 data-i18n="title">Campus Activity Picker</h1>
        <p class="subhead" data-i18n="subtitle">Choose from the teaching activity list with filters that respect location, time, and energy.</p>
      </div>
      <div class="toolbar">
        <label>
          <span data-i18n="language">Language</span>
          <select id="language">
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </label>
      </div>
    </header>

    <section class="grid" aria-label="Activity picker">
      <aside class="controls">
        <label>
          <span data-i18n="location">Location</span>
          <select id="location"></select>
        </label>
        <label>
          <span data-i18n="minutes">Maximum minutes</span>
          <select id="minutes"></select>
        </label>
        <label>
          <span data-i18n="energy">Energy</span>
          <select id="energy"></select>
        </label>
        <div class="count" id="poolCount" aria-live="polite"></div>
        <button class="primary" id="pickButton" type="button" data-i18n="pick">Pick for me</button>
        <button class="secondary" id="resetButton" type="button" data-i18n="reset">Reset filters</button>
        <button class="danger" id="clearButton" type="button" data-i18n="clear">Clear history</button>
      </aside>

      <div class="content">
        <section class="result" id="result" aria-live="polite"></section>
        <section class="history">
          <h2 class="section-title" data-i18n="history">Recent picks</h2>
          <ul class="history-list" id="historyList"></ul>
        </section>
        <section class="activity-strip">
          <h2 class="section-title" data-i18n="available">Matching activities</h2>
          <ul class="activity-list" id="activityList"></ul>
        </section>
      </div>
    </section>
    <footer class="disclaimer">
      <p data-i18n="disclaimer">教學模擬活動，不是校方公告</p>
    </footer>
  </main>

  <script>
    const activities = [
      { id: "A01", name_zh: "整理書包", name_en: "Organize your bag", location_type: "indoor", minutes: 10, energy: "low" },
      { id: "A02", name_zh: "畫一張小卡", name_en: "Draw a small card", location_type: "indoor", minutes: 15, energy: "low" },
      { id: "A03", name_zh: "寫三句讀書筆記", name_en: "Write three study notes", location_type: "indoor", minutes: 10, energy: "low" },
      { id: "A04", name_zh: "安靜讀兩頁書", name_en: "Read two pages quietly", location_type: "indoor", minutes: 15, energy: "low" },
      { id: "A05", name_zh: "排好明日待辦", name_en: "Plan tomorrow's tasks", location_type: "indoor", minutes: 20, energy: "low" },
      { id: "A06", name_zh: "整理本機練習檔", name_en: "Organize practice files", location_type: "indoor", minutes: 30, energy: "medium" },
      { id: "A07", name_zh: "在合適位置慢走", name_en: "Take a gentle walk in a suitable area", location_type: "outdoor", minutes: 15, energy: "low" },
      { id: "A08", name_zh: "觀察天空並畫草圖", name_en: "Observe the sky and sketch", location_type: "outdoor", minutes: 20, energy: "low" },
      { id: "A09", name_zh: "在合適位置快走", name_en: "Take a brisk walk in a suitable area", location_type: "outdoor", minutes: 30, energy: "medium" },
      { id: "A10", name_zh: "規劃小組練習", name_en: "Plan a group exercise", location_type: "indoor", minutes: 45, energy: "medium" },
      { id: "A11", name_zh: "記錄自然色彩", name_en: "Record colors in nature", location_type: "outdoor", minutes: 45, energy: "low" },
      { id: "A12", name_zh: "構思下一次社團活動", name_en: "Brainstorm a future club activity", location_type: "indoor", minutes: 60, energy: "medium" }
    ];

    const text = {
      en: {
        title: "Campus Activity Picker",
        subtitle: "Choose from the teaching activity list with filters that respect location, time, and energy.",
        language: "Language",
        location: "Location",
        minutes: "Maximum minutes",
        energy: "Energy",
        pick: "Pick for me",
        reset: "Reset filters",
        clear: "Clear history",
        history: "Recent picks",
        available: "Matching activities",
        any: "Any",
        indoor: "Indoor",
        outdoor: "Outdoor",
        low: "Low",
        medium: "Medium",
        noPick: "No activity selected yet.",
        noMatch: "No matching activity. Change one filter and try again.",
        pool: count => `${count} matching ${count === 1 ? "activity" : "activities"}`,
        emptyHistory: "No successful picks yet.",
        locationFact: "Location",
        timeFact: "Time",
        energyFact: "Energy",
        minutesText: value => `${value} minutes`,
        disclaimer: "Teaching simulation activity, not an official campus announcement"
      },
      zh: {
        title: "校園活動抽選器",
        subtitle: "依照地點、時間與體力條件，從教學活動清單中抽選。",
        language: "語言",
        location: "地點",
        minutes: "最多分鐘",
        energy: "體力",
        pick: "幫我選",
        reset: "重設篩選",
        clear: "清除紀錄",
        history: "最近抽選",
        available: "符合活動",
        any: "不限",
        indoor: "室內",
        outdoor: "室外",
        low: "低",
        medium: "中",
        noPick: "尚未抽選活動。",
        noMatch: "沒有符合條件的活動，請調整篩選。",
        pool: count => `符合活動：${count} 項`,
        emptyHistory: "尚無成功抽選紀錄。",
        locationFact: "地點",
        timeFact: "時間",
        energyFact: "體力",
        minutesText: value => `${value} 分鐘`,
        disclaimer: "教學模擬活動，不是校方公告"
      }
    };

    const state = {
      language: "en",
      current: null,
      history: []
    };

    const controls = {
      language: document.querySelector("#language"),
      location: document.querySelector("#location"),
      minutes: document.querySelector("#minutes"),
      energy: document.querySelector("#energy"),
      pick: document.querySelector("#pickButton"),
      reset: document.querySelector("#resetButton"),
      clear: document.querySelector("#clearButton"),
      pool: document.querySelector("#poolCount"),
      result: document.querySelector("#result"),
      history: document.querySelector("#historyList"),
      activityList: document.querySelector("#activityList")
    };

    function t(key) {
      return text[state.language][key];
    }

    function activityName(activity) {
      return state.language === "zh" ? activity.name_zh : activity.name_en;
    }

    function setOptions() {
      const optionSets = {
        location: [
          ["any", t("any")],
          ["indoor", t("indoor")],
          ["outdoor", t("outdoor")]
        ],
        minutes: [
          ["any", t("any")],
          ["15", "15"],
          ["30", "30"],
          ["60", "60"]
        ],
        energy: [
          ["any", t("any")],
          ["low", t("low")],
          ["medium", t("medium")]
        ]
      };

      Object.entries(optionSets).forEach(([key, options]) => {
        const select = controls[key];
        const currentValue = select.value || "any";
        select.innerHTML = options.map(([value, label]) => `<option value="${value}">${label}</option>`).join("");
        select.value = currentValue;
      });
    }

    function matchingActivities() {
      const location = controls.location.value;
      const minutes = controls.minutes.value;
      const energy = controls.energy.value;

      return activities.filter(activity => {
        const locationOk = location === "any" || activity.location_type === location;
        const minutesOk = minutes === "any" || activity.minutes <= Number(minutes);
        const energyOk = energy === "any" || activity.energy === energy;
        return locationOk && minutesOk && energyOk;
      });
    }

    function renderResult(matchCount) {
      if (!state.current) {
        controls.result.innerHTML = `<p class="empty">${matchCount === 0 ? t("noMatch") : t("noPick")}</p>`;
        return;
      }

      controls.result.innerHTML = `
        <div class="activity-id">${state.current.id}</div>
        <h2 class="activity-name">${activityName(state.current)}</h2>
        <div class="facts">
          <div class="fact"><span>${t("locationFact")}</span><strong>${t(state.current.location_type)}</strong></div>
          <div class="fact"><span>${t("timeFact")}</span><strong>${t("minutesText")(state.current.minutes)}</strong></div>
          <div class="fact"><span>${t("energyFact")}</span><strong>${t(state.current.energy)}</strong></div>
        </div>
      `;
    }

    function renderHistory() {
      if (state.history.length === 0) {
        controls.history.innerHTML = `<li><span class="tag">--</span><span>${t("emptyHistory")}</span><span class="meta"></span></li>`;
        return;
      }

      controls.history.innerHTML = state.history.map(activity => `
        <li>
          <span class="tag">${activity.id}</span>
          <span>${activityName(activity)}</span>
          <span class="meta">${t("minutesText")(activity.minutes)} · ${t(activity.location_type)} · ${t(activity.energy)}</span>
        </li>
      `).join("");
    }

    function renderMatches(matches) {
      controls.activityList.innerHTML = matches.map(activity => `
        <li>
          <span class="tag">${activity.id}</span>
          <span>${activityName(activity)}</span>
          <span class="meta">${t("minutesText")(activity.minutes)} · ${t(activity.location_type)} · ${t(activity.energy)}</span>
        </li>
      `).join("");
    }

    function render() {
      document.documentElement.lang = state.language === "zh" ? "zh-Hant" : "en";
      document.querySelectorAll("[data-i18n]").forEach(node => {
        node.textContent = t(node.dataset.i18n);
      });
      setOptions();
      const matches = matchingActivities();
      controls.pool.textContent = t("pool")(matches.length);
      renderResult(matches.length);
      renderHistory();
      renderMatches(matches);
    }

    function pickActivity() {
      const matches = matchingActivities();
      if (matches.length === 0) {
        state.current = null;
        render();
        return;
      }

      const index = Math.floor(Math.random() * matches.length);
      state.current = matches[index];
      state.history = [state.current, ...state.history].slice(0, 5);
      render();
    }

    controls.language.addEventListener("change", event => {
      state.language = event.target.value;
      render();
    });

    [controls.location, controls.minutes, controls.energy].forEach(control => {
      control.addEventListener("change", () => {
        state.current = null;
        render();
      });
    });

    controls.pick.addEventListener("click", pickActivity);

    controls.reset.addEventListener("click", () => {
      controls.location.value = "any";
      controls.minutes.value = "30";
      controls.energy.value = "any";
      state.current = null;
      render();
    });

    controls.clear.addEventListener("click", () => {
      state.history = [];
      render();
    });

    render();
  </script>
</body>
</html>
